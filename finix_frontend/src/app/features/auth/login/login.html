<div class="login-page bg-slate-50 dark:bg-slate-900 transition-colors duration-300">
    <div class="login-card bg-white dark:bg-slate-800 shadow-xl rounded-2xl p-8 max-w-md w-full border dark:border-slate-700">
        <h2 class="title text-gray-800 dark:text-gray-100">Bienvenido a Finix</h2>
        <p class="subtitle text-gray-500 dark:text-gray-400">Ingresa tus credenciales para acceder al sistema.</p>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

            <div class="form-group mb-4">
                <label for="username" class="dark:text-gray-200">Usuario</label>
                <input id="username" type="text" formControlName="username" 
                       class="dark:bg-slate-700 dark:text-gray-100 dark:border-slate-600">
                
                <div *ngIf="f['username'].touched && f['username'].errors" class="validation-error">
                    <span *ngIf="f['username'].errors['required']">El usuario es obligatorio.</span>
                </div>
            </div>

            <div class="form-group mb-6">
                <label for="password" class="dark:text-gray-200">Contraseña</label>
                <input id="password" type="password" formControlName="password"
                       class="dark:bg-slate-700 dark:text-gray-100 dark:border-slate-600">
                
                <div *ngIf="f['password'].touched && f['password'].errors" class="validation-error">
                    <span *ngIf="f['password'].errors['required']">La contraseña es obligatoria.</span>
                </div>
            </div>

            <div *ngIf="errorMessage" class="alert-error">
                {{ errorMessage }}
            </div>

            <button type="submit" [disabled]="loginForm.invalid || isLoading" class="btn-submit">
                <span *ngIf="isLoading">Cargando...</span>
                <span *ngIf="!isLoading">Iniciar Sesión</span>
            </button>
        </form>
    </div>
</div>
