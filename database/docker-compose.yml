services:
  # ----------------------------------------------------------------
  # 1. SERVICIO DE BASE DE DATOS (DB)
  # ----------------------------------------------------------------
  db:
    image: docker.io/library/mysql:8.0
    container_name: finix-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: finixdb
      MYSQL_USER: finixuser
      MYSQL_PASSWORD: finixpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      # Mapea el puerto 3307 de tu máquina (host) al 3306 del contenedor.
      - "3307:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
volumes:
  mysql_data:
