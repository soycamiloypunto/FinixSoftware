<mat-form-field appearance="fill" class="w-full">
  <mat-label class="dark:text-gray-400">{{ label }}</mat-label>
  <input 
    matInput
    class="dark:text-white"
    [type]="type"
    [placeholder]="placeholder"
    [value]="value"
    [disabled]="isDisabled"
    (input)="onValueChange($event)"
    (blur)="onBlur()">
  
  @if(hint) {
    <mat-hint class="dark:text-gray-500">{{ hint }}</mat-hint>
  }
</mat-form-field>
