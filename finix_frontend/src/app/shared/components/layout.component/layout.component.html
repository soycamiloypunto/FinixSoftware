<mat-sidenav-container class="h-full w-full">
  
  <mat-sidenav #sidenav mode="side" opened class="w-64 border-none bg-finix-dark dark:border-r dark:border-slate-700 dark:bg-slate-800 text-white">
    <div class="py-6 px-4 flex justify-center items-center">
      <img src="assets/finix_logo_new.png" alt="Finix" class="h-24 w-auto object-contain dark:drop-shadow-[0_0_5px_rgba(255,255,255,0.3)]">
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/tiempos" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">timer</mat-icon>
        <span matListItemTitle class="text-gray-200">Tiempos</span>
      </a>
      <a mat-list-item routerLink="/ventas" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">point_of_sale</mat-icon>
        <span matListItemTitle class="text-gray-200">Ventas</span>
      </a>
      <a mat-list-item routerLink="/productos" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">inventory_2</mat-icon>
        <span matListItemTitle class="text-gray-200">Productos</span>
      </a>
      <a mat-list-item routerLink="/compras" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">wallet</mat-icon>
        <span matListItemTitle class="text-gray-200">Compras</span>
      </a>
      <a mat-list-item routerLink="/egresos" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">money</mat-icon>
        <span matListItemTitle class="text-gray-200">Egreso</span>
      </a>
      <a mat-list-item routerLink="/proveedores" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">store</mat-icon>
        <span matListItemTitle class="text-gray-200">Proveedores</span>
      </a>
      <a mat-list-item routerLink="/reporte-diario" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">report</mat-icon>
        <span matListItemTitle class="text-gray-200">Reporte Diario</span>
      </a>
      <a *ngIf="isAdmin" mat-list-item routerLink="/usuarios" routerLinkActive="bg-white/10 text-finix-yellow border-r-4 border-finix-yellow dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-400">
        <mat-icon matListItemIcon class="text-gray-300">people</mat-icon>
        <span matListItemTitle class="text-gray-200">Usuarios</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  
  <mat-sidenav-content class="bg-gray-50 dark:bg-slate-900">
    <mat-toolbar class="bg-finix-dark text-white dark:bg-slate-800 shadow-sm">
       <button mat-icon-button (click)="sidenav.toggle()" class="text-white dark:text-gray-200">
          <mat-icon>menu</mat-icon>
       </button>
       <span class="text-white dark:text-gray-100">Panel de Administración</span>
       <span class="flex-auto"></span>
       <app-theme-toggle></app-theme-toggle>
       <button mat-icon-button (click)="logout()" class="text-red-300 dark:text-red-400">
            <mat-icon>logout</mat-icon>
       </button>
    </mat-toolbar>

    <main class="p-4 md:p-8">
      <!-- Aquí se cargarán los componentes de cada ruta (Clientes, Productos, etc.) -->
      <router-outlet></router-outlet>
    </main>
    
  </mat-sidenav-content>

</mat-sidenav-container>
