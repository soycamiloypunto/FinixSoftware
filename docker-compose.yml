version: '3.8'

services:
  # ----------------------------------------------------------------
  # 1. SERVICIO DE BASE DE DATOS (DB)
  # ----------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: finix-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: finixdb
      MYSQL_USER: finixuser
      MYSQL_PASSWORD: finixpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      # Mapea el puerto 3307 de tu máquina (host) al 3306 del contenedor.
      - "3307:3306"
    volumes:
      # --- CORRECCIÓN IMPORTANTE AQUÍ ---
      # Ejecuta el script 'init.sql' al iniciar el contenedor para crear el usuario 'finixuser'@'%'
      # Esto soluciona el error de "Host not allowed to connect"
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql

  # ----------------------------------------------------------------
  # 2. SERVICIO BACKEND PRINCIPAL (MVC)
  # ----------------------------------------------------------------
  backend:
    build:
      context: ./finix
      dockerfile: Dockerfile
    container_name: finix-backend
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # La URL de conexión usa el nombre del servicio (db) como host.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/finixdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: finixuser
      SPRING_DATASOURCE_PASSWORD: finixpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update

  # ----------------------------------------------------------------
  # 3. NUEVO SERVICIO BACKEND DE SEGURIDAD/LOGIN (WEBFLUX)
  # ----------------------------------------------------------------
  security:
    build:
      context: ./finix_security
      dockerfile: Dockerfile
    container_name: finix-security-webflux
    ports:
      # Mapeamos a 8081 en el host para no chocar con el backend principal
      - "8081:8081" 
    restart: unless-stopped
    depends_on:
      - db
    environment:
      # También necesita conectarse a la base de datos para obtener el usuario
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/finixdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: finixuser
      SPRING_DATASOURCE_PASSWORD: finixpassword
      # DDL_AUTO puede ser 'none' o 'update' si maneja sus propias entidades
      SPRING_JPA_HIBERNATE_DDL_AUTO: none 
      # Añadir aquí cualquier otra variable de entorno necesaria para JWT, etc.


  # ----------------------------------------------------------------
  # 4. SERVICIO DE FRONTEND
  # ----------------------------------------------------------------
  frontend:
    build:
      context: ./finix_frontend
      dockerfile: Dockerfile
    container_name: finix-frontend
    ports:
      - "4200:4000"
    restart: unless-stopped
    depends_on:
      - backend # Depende de los backends si necesita hacer llamadas iniciales
      - security

volumes:
  mysql_data:
